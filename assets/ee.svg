<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8502E"/>
      <stop offset="0.55" stop-color="#F7A440"/>
      <stop offset="1" stop-color="#58A6FF"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#21262d"/>
    </pattern>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="r1" d="M740 90 L880 70 L1020 110 L1085 235"/>
    <path id="r2" d="M765 235 L900 190 L1020 110"/>
    <path id="r3" d="M740 90 L900 190 L1085 235"/>
    <path id="r4" d="M1085 235 L965 262 L765 235"/>
  </defs>

  <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
  <g clip-path="url(#card)">
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <rect x="0" y="314" width="1200" height="6" fill="url(#bar)"/>
  </g>

  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#6e7681">
    <text x="70" y="62">~/ma2t $ whoami</text>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif">
    <text x="68" y="128" font-size="56" font-weight="700" fill="#f0f6fc">Matteo <tspan fill="#E8502E">Castrataro</tspan></text>
  </g>
  <rect x="70" y="146" width="64" height="4" rx="2" fill="#E8502E"/>

  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
    <text x="70" y="192" font-size="22" fill="#c9d1d9"><tspan fill="#E8502E">$</tspan> systems programmer &#183; security student</text>
    <rect x="594" y="174" width="12" height="22" fill="#E8502E">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <text x="70" y="232" font-size="17" fill="#8b949e">C &#183; C++ &#183; TypeScript &#183; Node.js &#183; PostgreSQL &#183; Docker</text>
    <text x="70" y="270" font-size="14" fill="#6e7681">42 Belgium  &#183;  EPHEC &#183; Systems Security  &#183;  Brussels</text>
  </g>

  <g stroke="#30363d" stroke-width="2" fill="none">
    <path d="M740 90 L880 70 L1020 110 L1085 235"/>
    <path d="M740 90 L900 190 L1085 235"/>
    <path d="M765 235 L900 190 L1020 110"/>
    <path d="M1085 235 L965 262 L765 235"/>
  </g>

  <g>
    <rect x="731" y="81" width="18" height="18" rx="4" fill="#0d1117" stroke="#E8502E" stroke-width="2"/>
    <rect x="871" y="61" width="18" height="18" rx="4" fill="#0d1117" stroke="#484f58" stroke-width="2"/>
    <rect x="1011" y="101" width="18" height="18" rx="4" fill="#0d1117" stroke="#58A6FF" stroke-width="2"/>
    <rect x="891" y="181" width="18" height="18" rx="4" fill="#0d1117" stroke="#F7A440" stroke-width="2"/>
    <rect x="756" y="226" width="18" height="18" rx="4" fill="#0d1117" stroke="#484f58" stroke-width="2"/>
    <rect x="956" y="253" width="18" height="18" rx="4" fill="#0d1117" stroke="#484f58" stroke-width="2"/>
    <rect x="1076" y="226" width="18" height="18" rx="4" fill="#0d1117" stroke="#E8502E" stroke-width="2"/>
    <circle cx="900" cy="190" r="14" fill="none" stroke="#F7A440" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="9;22" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g filter="url(#glow)">
    <circle r="5" fill="#E8502E"><animateMotion dur="4.5s" repeatCount="indefinite"><mpath href="#r1"/></animateMotion></circle>
    <circle r="5" fill="#E8502E"><animateMotion dur="4.5s" begin="-2.25s" repeatCount="indefinite"><mpath href="#r1"/></animateMotion></circle>
    <circle r="4.5" fill="#58A6FF"><animateMotion dur="3.6s" begin="-1s" repeatCount="indefinite"><mpath href="#r2"/></animateMotion></circle>
    <circle r="4.5" fill="#F7A440"><animateMotion dur="5s" begin="-3s" repeatCount="indefinite"><mpath href="#r3"/></animateMotion></circle>
    <circle r="4" fill="#8b949e"><animateMotion dur="6s" begin="-1.5s" repeatCount="indefinite"><mpath href="#r4"/></animateMotion></circle>
  </g>

  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#484f58">
    <text x="1010" y="52">route &#183; state &#183; flow</text>
  </g>
</svg>
